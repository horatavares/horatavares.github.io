<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prof. André Tavares | Aulas Particulares</title>
  
  <meta name="description" content="Aulas particulares personalizadas e on-line de Filosofia, Humanidades, Hebraico, Grego, Inglês e Francês.">
  <link rel="icon" type="image/png" href="https://horatavares.github.io/logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #f4eee3; /* Fundo areia nas laterais para telas grandes */
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
    }

    /* Contêiner que segura a largura ideal */
    .site-wrapper {
      width: 100%;
      max-width: 980px; /* Limita a largura em telas largas para não esticar os elementos */
      height: 100%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.06); /* Sombra suave de acabamento editorial */
      background-color: #ffffff;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="site-wrapper">
    <iframe 
      src="https://www.canva.com/design/DAHaSYCAleU/GXKZxrVeljYg-axq9tBHtw/view?embed" 
      loading="lazy" 
      allowfullscreen="allowfullscreen" 
      allow="fullscreen; clipboard-write">
    </iframe>
  </div>

</body>
</html>
